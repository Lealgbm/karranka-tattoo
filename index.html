<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início - Karranka Tattoos</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    text {
      font-size: 100px;
      font-family: 'Lobster', sans-serif;
      fill: url(#grad1);
      stroke: #ff0000;
      stroke-width: 3px;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: stroke-offset 5s forwards;
      filter: drop-shadow(3px 3px 5px black);
    }

    @keyframes stroke-offset {
      to {
        stroke-dashoffset: 0;
      }
    }

    nav {
      background-color: #000;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff0000;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h2 {
      font-size: 36px;
      color: #fff;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #ccc;
      max-width: 600px;
      margin: 0 auto;
    }

    .botao-chamativo {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background-color: #ff0000;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .botao-chamativo:hover {
      background-color: #cc0000;
    }

    .animacao-fade {
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .galeria-inicio {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }

    .galeria-inicio img {
      width: 300px;
      height: auto;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .galeria-inicio img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #ff0000;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      color: white;
    }
  </style>
</head>
<body>

    <div class="wrapper">
      <svg viewBox="0 0 960 300">

          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ffffff; stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ff0000; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#000000; stop-opacity:1" />
          </linearGradient>
        </defs>
        <text text-anchor="middle" x="50%" y="50%" dy=".35em">KARRANKA</text>
      </svg>
    </div>
  </header>

    <a href="galeria.html" class="botao-chamativo">Ver Galeria</a>
