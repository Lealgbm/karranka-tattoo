  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    text {
      font-size: 100px;
      font-family: 'Lobster', sans-serif;
      fill: url(#grad1);
      stroke: #ff0000;
      stroke-width: 3px;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: stroke-offset 5s forwards;
      filter: drop-shadow(3px 3px 5px black);
      user-select: none;
    }

    @keyframes stroke-offset {
      to {
        stroke-dashoffset: 0;
      }
    }

    nav {
      background-color: #000;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover, nav a.active {
      color: #ff0000;
    }

    .contato-info {
      max-width: 600px;
      margin: 40px auto;
      background-color: #1a1a1a;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px #ff0000;
      animation: fadeInUp 1.5s ease forwards;
    }

    .contato-info p {
      margin: 15px 0;
      font-size: 1.2rem;
      line-height: 1.5;
    }

    .contato-info a {
      color: #ff0000;
      text-decoration: none;
      transition: color 0.3s;
      word-break: break-word;
    }

    .contato-info a:hover {
      color: #cc0000;
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      color: white;
      font-size: 0.9rem;
      margin-top: 60px;
      user-select: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  
    @media (max-width: 640px) {
      .contato-info {
        margin: 20px 15px;
        padding: 20px 15px;
      }
      .contato-info p {
        font-size: 1rem;
      }
      text {
        font-size: 70px;
      }
    }
  </style>
</head>
