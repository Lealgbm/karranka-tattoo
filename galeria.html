<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria - Karranka Tattoos</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* Cabeçalho SVG */
    text {
      font-size: 100px;
      font-family: 'Lobster', sans-serif;
      fill: url(#grad1);
      stroke: #ff0000;
      stroke-width: 3px;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: stroke-offset 5s forwards;
      filter: drop-shadow(3px 3px 5px black);
    }

    @keyframes stroke-offset {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Navegação */
    nav {
      background-color: #000;
      text-align: center;
      padding: 15px 0;
      border-bottom: 2px solid #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 25px;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 3px solid transparent;
      padding-bottom: 5px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    nav a:hover,
    nav a.active {
      color: #ff0000;
      border-color: #ff0000;
    }

    /* Container das colunas */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    /* Cada coluna de imagem */
    .coluna {
      background: #222;
      border: 2px solid #fff;
      border-radius: 12px;
      padding: 15px;
      width: 280px;
      box-shadow: 0 0 8px #ff0000;
      transition: box-shadow 0.3s ease;
    }

    .coluna:hover {
      box-shadow: 0 0 18px #ff0000;
    }

    .coluna img {
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-bottom: 12px;
    }

    .coluna h3 {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
      color: #ff0000;
    }

    .coluna p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.3;
      color: #eee;
    }

    /* Rodapé */
    footer {
      text-align: center;
      padding: 20px 0;
      background-color: #000;
      border-top: 2px solid #fff;
      color: white;
      font-size: 0.9rem;
      user-select: none;
      margin-top: 50px;
    }

    /* Responsivo */
    @media (max-width: 960px) {
      .container {
        justify-content: center;
      }
      .coluna {
        width: 90%;
        max-width: 400px;
      }
    }
  </style>
</head>

            <stop offset="50%" style="stop-color:#ff0000; stop-opacity:1" />
